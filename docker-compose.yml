services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: one
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__One: "Host=postgres;Database=one;Username=postgres;Password=postgres;Gss Encryption Mode=Disable"
      Smtp__Host: mailpit
      Smtp__Porta: "1025"
      App__UrlBase: "http://localhost:8080"
      Llm__ChaveApi: ${LLM_CHAVE_API:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
