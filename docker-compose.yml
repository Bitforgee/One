services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: one
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: cgr.dev/chainguard/minio@sha256:090010a3f73f6aa2dff606c61cd0de3640b22748abe19f4e48cce6dc9de7a53f
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: one
      MINIO_ROOT_PASSWORD: one-minio-dev
      MC_HOST_local: "http://one:one-minio-dev@localhost:9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__One: "Host=postgres;Database=one;Username=postgres;Password=postgres;Gss Encryption Mode=Disable"
      Smtp__Host: mailpit
      Smtp__Porta: "1025"
      App__UrlBase: "http://localhost:8080"
      Llm__ChaveApi: ${LLM_CHAVE_API:-}
      Armazenamento__Endpoint: "http://minio:9000"
      Armazenamento__Chave: one
      Armazenamento__Segredo: one-minio-dev
      Armazenamento__Bucket: one
      Push__ChavePublica: ${PUSH_CHAVE_PUBLICA:-}
      Push__ChavePrivada: ${PUSH_CHAVE_PRIVADA:-}
      Push__Assunto: ${PUSH_ASSUNTO:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
